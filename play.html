<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0e0c0a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>RUIN — Play</title>
<style>
:root {
  --bg:#0e0c0a; --elev:#1a1612; --elev2:#241f18; --border:#3a3228;
  --text:#f0e6d2; --muted:#a89880; --accent:#c9a227;
  --colovian:#6b8cae; --anu:#c45c26;
  --high:#4a9; --low:#b44; --shadow:0 8px 28px rgba(0,0,0,.55);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);min-height:100%;min-height:100vh;min-height:100dvh;overflow-x:hidden;max-width:100%}
body{background-image:radial-gradient(ellipse at top,#1c1812 0%,var(--bg) 55%)}
button,select{font:inherit;color:inherit}
.screen{display:none;min-height:100vh;min-height:100dvh;flex-direction:column;min-width:0;width:100%}
.screen.on{display:flex}
h1{margin:0;font-size:1.35rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.sub{color:var(--muted);font-size:.85rem;margin:.35rem 0 1rem}
.pad{padding:16px 16px calc(16px + var(--safe-bottom))}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{appearance:none;background:var(--elev2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;min-height:44px;font-weight:600}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:#1a1408;border-color:var(--accent)}
.btn.col{border-color:var(--colovian);color:#dbe7f4}
.btn.anu{border-color:var(--anu);color:#f3d4c4}
.btn.picked{outline:2px solid var(--accent)}
.btn.wide{flex:1 1 100%}
label.field{display:flex;flex-direction:column;gap:4px;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:10px 0}
select, .field input{background:var(--elev);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:1rem;min-height:44px;color:var(--text)}
/* game layout — syphas glass, yellow-green veins, never blue */
#game.screen.on{
  position:relative;
  height:100vh;height:100svh;max-height:100vh;max-height:100svh;overflow:hidden;
  background-color:#050505;
  background-image:
    radial-gradient(ellipse at 18% 22%, rgba(210,240,70,.10), transparent 42%),
    radial-gradient(ellipse at 82% 78%, rgba(190,220,50,.08), transparent 46%),
    radial-gradient(ellipse at 50% 50%, rgba(20,20,16,.3), #050505 70%),
    repeating-linear-gradient(118deg, transparent 0 36px, rgba(200,230,60,.04) 37px, rgba(220,255,90,.14) 38px, rgba(160,190,40,.05) 39px, transparent 41px, transparent 88px),
    repeating-linear-gradient(62deg, transparent 0 52px, rgba(180,210,50,.03) 53px, rgba(210,245,80,.11) 54px, transparent 56px, transparent 120px);
  background-size:100% 100%,100% 100%,100% 100%, 220px 220px, 280px 280px;
}
#pulse{pointer-events:none;position:absolute;inset:0;z-index:8;display:none;
  background:linear-gradient(105deg, transparent 20%, rgba(200,240,70,.0) 38%, rgba(220,255,100,.28) 50%, rgba(180,220,50,.0) 62%, transparent 80%)}
#game.timefall #pulse{display:block;animation:syphasPulse 1.15s ease-out 1}
@keyframes syphasPulse{
  0%{opacity:0;transform:translateX(-30%)}
  25%{opacity:1}
  100%{opacity:0;transform:translateX(30%)}
}
#table{flex:0 0 auto;min-height:0;min-width:0;overflow:visible}
#topbar,#youbar{padding:6px 10px;background:rgba(8,8,6,.82);border-bottom:1px solid rgba(200,230,70,.18);flex:0 0 auto;backdrop-filter:blur(6px)}
#youbar{border-top:1px solid rgba(200,230,70,.18);border-bottom:0;padding-bottom:6px}
.statline{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:nowrap}
.name{font-weight:700;white-space:nowrap;flex:0 0 auto}.name.col{color:#d7c27a}.name.anu{color:#e0c56a}
.pills{display:flex;gap:6px;flex-wrap:nowrap;align-items:center;min-width:0;overflow:auto}
.pill{background:rgba(20,18,12,.8);border:1px solid rgba(200,230,70,.22);border-radius:999px;padding:4px 9px;font-size:.8rem}
.crystals{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.crystal{display:inline-flex;align-items:center;gap:5px;background:rgba(20,18,12,.8);border:1px solid rgba(201,162,39,.45);border-radius:999px;padding:3px 9px 3px 4px;font-size:.8rem;font-weight:700}
.crystal .gem{width:22px;height:22px;font-size:.68rem}
.crystal.wage-bill{border-color:rgba(200,140,50,.5)}
.side-row{display:flex;gap:8px;align-items:stretch;padding:4px 8px;min-width:0;flex:0 0 auto}
.leader-slot{flex:0 0 136px;min-width:0}
.side-row .board{flex:1;min-width:0}
.board{padding:4px 6px;min-height:0}
.board.empty{padding:0;min-height:0}
.lane{display:flex;gap:6px;flex-wrap:wrap}
/* gems: cost / might / wage — never health or attack */
.gem{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-weight:800;font-size:.72rem;line-height:1;position:relative;
  box-shadow:0 0 0 1px rgba(0,0,0,.65),0 2px 5px rgba(0,0,0,.55)}
.gem.cost{background:radial-gradient(circle at 35% 30%,#f3e08a,#c9a227 58%,#5a450c);color:#1a1408}
.gem.might{background:radial-gradient(circle at 35% 30%,#e8f79a,#8ea32c 55%,#2a320c);color:#f7f4dc}
.gem.might.hurt{box-shadow:0 0 0 2px #c43333,0 0 8px rgba(220,50,50,.65),0 2px 5px rgba(0,0,0,.55)}
.gem .dmg{position:absolute;top:-7px;right:-7px;min-width:15px;height:15px;padding:0 3px;border-radius:999px;background:#b01c1c;color:#fff;font-size:.58rem;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1px #4a0000}
.gem.wage{background:radial-gradient(circle at 35% 30%,#f0d2a0,#b06a28 58%,#4a2a0c);color:#1a1208}
.gem.life{background:radial-gradient(circle at 35% 30%,#f0c070,#a84820 55%,#4a1808);color:#fff8e8;width:30px;height:30px;font-size:.8rem}
/* board tokens */
.token{position:relative;background:rgba(18,16,12,.88);border:1px solid rgba(200,230,70,.28);border-radius:12px;padding:0;min-width:86px;max-width:48%;overflow:hidden;text-align:left;box-shadow:0 4px 14px rgba(0,0,0,.5);-webkit-appearance:none;appearance:none}
.token.tapped{opacity:.65}
.token.atk{outline:2px solid #c9a227}
.token.blk{outline:2px solid #d7c27a}
.token.sel{outline:2px solid #e8f56a}
.token .art{display:block;width:100%;height:54px;object-fit:cover;background:#000}
.token .tn{display:block;font-weight:700;font-size:.72rem;padding:4px 6px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.token .gems{display:flex;gap:4px;align-items:center;padding:3px 6px 6px}
.token .meta{color:var(--muted);font-size:.62rem;padding:0 6px 4px}
#log{font-size:.75rem;color:var(--muted);padding:2px 10px;max-height:2.5em;overflow:auto;line-height:1.3;flex:0 0 auto}
#log:empty{display:none}
#prompt{padding:6px 10px;background:rgba(12,12,8,.9);border-top:1px solid rgba(200,230,70,.22);border-bottom:1px solid rgba(200,230,70,.22);flex:0 0 auto}
#prompt .q{font-weight:700;margin:0 0 6px;font-size:.88rem}
#handWrap{flex:1 1 auto;min-width:0;min-height:0;width:100%;overflow:hidden;border-top:1px solid rgba(200,230,70,.22);background:rgba(8,8,6,.92)}
#hand{display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;padding:6px 16px 8px;width:100%;max-width:100%;min-width:0;min-height:0;max-height:100%;height:100%;-webkit-overflow-scrolling:touch;scroll-snap-type:x mandatory;scrollbar-width:thin}
#hand::-webkit-scrollbar{height:6px}
#hand::-webkit-scrollbar-thumb{background:#c9e84a;border-radius:4px}
.card{flex:0 0 146px;width:146px;background:rgba(16,14,10,.95);border:1px solid rgba(200,230,70,.3);border-radius:12px;padding:0;min-height:0;box-shadow:0 6px 16px rgba(0,0,0,.55);text-align:left;overflow:hidden;scroll-snap-align:start;position:relative;-webkit-appearance:none;appearance:none}
.card.can{outline:2px solid #e8f56a}
.card .art{display:block;width:100%;height:68px;object-fit:cover;background:#000;border:0}
.card .body{padding:7px 8px 8px}
.card .cn{font-weight:700;font-size:.82rem;line-height:1.2;max-height:2.4em;overflow:hidden}
.card .gems{display:flex;flex-wrap:wrap;gap:5px;margin:5px 0 4px;align-items:center}
.card .ct{color:var(--text);font-size:.64rem;line-height:1.3;max-height:2.7em;overflow:auto;white-space:pre-wrap}
.card .cost-slot{position:absolute;top:6px;left:6px;z-index:2}
.lcard{width:100%;background:rgba(16,14,10,.95);border:1px solid rgba(200,230,70,.4);border-radius:12px;padding:0;overflow:hidden;text-align:left;box-shadow:0 6px 16px rgba(0,0,0,.55);-webkit-appearance:none;appearance:none}
.lcard .portrait{position:relative}
.lcard .art{display:block;width:100%;height:64px;object-fit:cover;background:#000}
.lcard .life-wrap{position:absolute;left:6px;bottom:6px}
.lcard .rune{position:absolute;right:6px;bottom:6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.rune-gem{width:22px;height:22px;border-radius:4px;transform:rotate(45deg);
  box-shadow:0 0 0 1px rgba(0,0,0,.6),0 2px 4px rgba(0,0,0,.5)}
.rune.high .rune-gem{background:radial-gradient(circle at 35% 30%,#f3ff9a,#b8d94a 55%,#3a4a10);box-shadow:0 0 10px rgba(210,240,70,.85),0 0 0 1px #8faa2a}
.rune.low .rune-gem{background:radial-gradient(circle at 35% 30%,#3a3a30,#1a1a14 70%,#0a0a08);box-shadow:0 0 0 1px #2a2a22;opacity:.7}
.rune-lab{font-size:.58rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.rune.high .rune-lab{color:#d8f070}
.rune.low .rune-lab{color:#7a7460}
.lcard .body{padding:6px 7px 8px}
.lcard .cn{font-weight:700;font-size:.76rem;line-height:1.2;color:#e8f56a}
.lcard .ct{font-size:.62rem;line-height:1.25;color:var(--text);max-height:2.6em;overflow:auto;white-space:pre-wrap}
.bar-acts{display:flex;gap:6px;padding:0;align-items:center}
/* modal */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:40;padding:18px 12px calc(18px + var(--safe-bottom));overflow:auto}
.modal.on{display:block}
.sheet{background:var(--elev);border:1px solid var(--border);border-radius:16px;padding:16px;max-width:520px;margin:0 auto;box-shadow:var(--shadow)}
.sheet h2{margin:0 0 10px;font-size:1.05rem;color:var(--accent)}
.sheet .art{width:100%;border-radius:10px;margin:0 0 10px;background:#000}
.sheet .txt{white-space:pre-wrap;line-height:1.45}
.kw{color:var(--accent);border-bottom:1px dotted var(--accent);cursor:pointer}
#tip{position:fixed;z-index:50;max-width:260px;background:#2a2318;color:var(--text);border:1px solid var(--accent);border-radius:8px;padding:8px 10px;font-size:.85rem;box-shadow:var(--shadow);display:none}
#endbox{text-align:center;padding:24px 12px}
#endbox .big{font-size:1.6rem;color:var(--accent);margin:0 0 8px}

.btn.danger{border-color:#7a3030;color:#f0c8c8}
.btn.small{padding:6px 8px;min-height:32px;font-size:.8rem;flex:0 0 auto}
#setupErr{color:#e08880;font-size:.9rem;margin:.6rem 0 0;min-height:1.2em}
/* builder */
#builder{background:var(--bg)}
#builder .btop{position:sticky;top:0;z-index:5;background:rgba(14,12,10,.96);border-bottom:1px solid var(--border);padding:10px 12px 8px}
#builder .sum{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;align-items:flex-end}
.curve{display:flex;gap:4px;align-items:flex-end;height:48px;flex:1}
.curve .bar{flex:1;background:var(--elev2);border:1px solid var(--border);border-radius:4px 4px 0 0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:22px;overflow:hidden}
.curve .bar i{display:block;width:100%;background:var(--accent);min-height:2px}
.curve .bar span{font-size:.62rem;color:var(--muted);padding:1px 0}
#dlist{padding:0 0 calc(88px + var(--safe-bottom))}
.drow{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--border)}
.drow .dinfo{flex:1;text-align:left;background:transparent;border:0;padding:4px 0;min-height:44px;color:inherit}
.drow .dn{font-weight:700;font-size:.88rem;display:block}
.drow .dm{color:var(--muted);font-size:.72rem}
.drow .dinfo.anu .dn{color:#f3d4c4}
.drow .dinfo.col .dn{color:#dbe7f4}
.pm{appearance:none;background:var(--elev2);border:1px solid var(--border);border-radius:10px;width:44px;height:44px;font-size:1.25rem;font-weight:700;flex:0 0 44px}
.dcount{min-width:1.4em;text-align:center;font-weight:700}
.drow.in{background:#1e1a14}
#builder .stickyacts{position:sticky;bottom:0;background:rgba(14,12,10,.96);border-top:1px solid var(--border);padding:8px 12px calc(10px + var(--safe-bottom));z-index:5}
.filt{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.filt .btn{padding:8px 10px;min-height:38px;font-size:.8rem}
.filt .btn.picked{outline:2px solid var(--accent)}
.search{width:100%;background:var(--elev);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:1rem;min-height:44px;color:var(--text)}
.savedrow{display:flex;flex-direction:column;gap:4px;background:var(--elev);border:1px solid var(--border);border-radius:12px;padding:10px;margin:8px 0}
.savedrow .sn{font-weight:700}
textarea.code{width:100%;min-height:120px;background:var(--elev);border:1px solid var(--border);border-radius:8px;padding:10px;color:var(--text);font-family:ui-monospace,Menlo,monospace;font-size:.8rem}
</style>
</head>
<body>
<div id="setup" class="screen on pad">
  <h1>RUIN</h1>
  <p class="sub">Play against the AI. Round five build (t): base income 2, missed wages Age your highest Wage Soul. Decks may mix Colovian and Anu cards.</p>
  <label class="field">Your Leader
    <select id="leaderSel"></select>
  </label>
  <label class="field">Your deck
    <select id="myDeckSel"></select>
  </label>
  <p class="sub" id="myDeckPlan" style="margin-top:-6px"></p>
  <label class="field">AI deck
    <select id="aiDeckSel"></select>
  </label>
  <p class="sub" id="aiDeckPlan" style="margin-top:-6px"></p>
  <p id="setupErr"></p>
  <button class="btn primary wide" type="button" id="btnStart">Start game</button>
  <button class="btn wide" type="button" id="btnBuilder">Deck Builder</button>
  <button class="btn wide" type="button" id="btnRulesSetup">Rules</button>
</div>

<div id="builder" class="screen">
  <div class="btop">
    <div class="statline">
      <h1 style="font-size:1.05rem">Deck Builder</h1>
      <button class="btn small" type="button" id="btnBuilderBack">Back</button>
    </div>
    <label class="field">Deck name
      <input class="search" id="deckName" type="text" maxlength="60" placeholder="Name this deck" />
    </label>
    <label class="field">Leader
      <select id="builderLeader"></select>
    </label>
    <div class="sum">
      <div class="pill" id="deckCount">0/60</div>
      <div class="pill" id="deckTypes">—</div>
      <div class="pill" id="deckSets">—</div>
    </div>
    <div class="curve" id="deckCurve"></div>
    <p id="builderErr" class="sub" style="color:#e08880;margin:6px 0 0"></p>
    <input class="search" id="cardSearch" type="search" placeholder="Search by name" enterkeyhint="search" />
    <div class="filt" id="facFilt">
      <button class="btn" type="button" data-fac="Leader">Leader's faction</button>
      <button class="btn" type="button" data-fac="All">All</button>
      <button class="btn" type="button" data-fac="Colovian">Colovian</button>
      <button class="btn" type="button" data-fac="Anu">Anu</button>
    </div>
    <div class="filt" id="typeFilt">
      <button class="btn picked" type="button" data-type="">All types</button>
      <button class="btn" type="button" data-type="Martial">Martialus</button>
      <button class="btn" type="button" data-type="Economic">Economic</button>
      <button class="btn" type="button" data-type="Rite">Rite</button>
    </div>
    <div class="filt" id="costFilt">
      <button class="btn picked" type="button" data-cost="">Any Deploy</button>
      <button class="btn" type="button" data-cost="0">0</button>
      <button class="btn" type="button" data-cost="1">1</button>
      <button class="btn" type="button" data-cost="2">2</button>
      <button class="btn" type="button" data-cost="3">3</button>
      <button class="btn" type="button" data-cost="4">4</button>
      <button class="btn" type="button" data-cost="5">5+</button>
    </div>
  </div>
  <div id="dlist"></div>
  <div class="pad" id="savedWrap" style="padding-top:8px;padding-bottom:calc(96px + var(--safe-bottom))">
    <p class="sub" style="margin-top:0">Saved decks</p>
    <div id="savedList"></div>
  </div>
  <div class="stickyacts">
    <div class="row">
      <button class="btn primary" type="button" id="btnAuto">Auto-fill to 60</button>
      <button class="btn" type="button" id="btnSaveDeck">Save</button>
    </div>
    <div class="row" style="margin-top:6px">
      <button class="btn" type="button" id="btnExport">Export code</button>
      <button class="btn" type="button" id="btnImport">Import code</button>
    </div>
  </div>
</div>

<div id="game" class="screen">
  <div id="pulse" aria-hidden="true"></div>
  <div id="table">
    <div id="topbar">
      <div class="statline">
        <div><span class="name" id="aiName">AI</span></div>
        <div class="pills" id="aiPills"></div>
      </div>
    </div>
    <div class="side-row" id="aiRow">
      <div class="leader-slot" id="aiLeaderSlot"></div>
      <div class="board empty" id="aiBoard"></div>
    </div>
    <div id="log"></div>
    <div id="prompt"><div class="q" id="promptQ">Waiting…</div><div class="row" id="promptActs"></div></div>
    <div class="side-row" id="myRow">
      <div class="leader-slot" id="meLeaderSlot"></div>
      <div class="board empty" id="myBoard"></div>
    </div>
  </div>
  <div id="handWrap">
    <div id="hand"></div>
  </div>
  <div id="youbar">
    <div class="statline">
      <div><span class="name" id="meName">You</span></div>
      <div class="pills" id="mePills"></div>
      <div class="bar-acts">
        <button class="btn small" type="button" id="btnRules">Rules</button>
        <button class="btn small" type="button" id="btnNew" style="display:none">New game</button>
      </div>
    </div>
  </div>
</div>

<div id="cardModal" class="modal" role="dialog"><div class="sheet" id="cardSheet"></div></div>
<div id="rulesModal" class="modal" role="dialog"><div class="sheet" id="rulesSheet"></div></div>
<div id="endModal" class="modal"><div class="sheet" id="endbox"></div></div>
<div id="codeModal" class="modal" role="dialog"><div class="sheet" id="codeSheet"></div></div>

<div id="tip"></div>

<script src="play/cards.js?v=20261114tsyphas"></script>
<script src="play/rules.js?v=20261114tsyphas"></script>
<script src="play/engine.js?v=20261114tsyphas"></script>
<script src="play/deck.js?v=20261114tsyphas"></script>
<script src="play/app.js?v=20261114tsyphas"></script>
</body>
</html>
