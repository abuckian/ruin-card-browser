<!DOCTYPE html>
<html lang="en">
<head>
<!-- face-batch2-fix-ruin-cards -->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0e0c0a" />
<title>RUIN Cards</title>
<style>
:root {
  --bg: #0e0c0a;
  --bg-elev: #1a1612;
  --bg-elev-2: #241f18;
  --border: #3a3228;
  --text: #f0e6d2;
  --muted: #a89880;
  --accent: #c9a227;
  --colovian: #6b8cae;
  --anu: #c45c26;
  --leader: #c9a227;
  --shadow: 0 8px 28px rgba(0,0,0,.55);
  --radius: 12px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); min-height: 100%; }
body {
  background-image:
    radial-gradient(ellipse at top, #1c1812 0%, var(--bg) 55%),
    linear-gradient(180deg, transparent, #080706);
  background-attachment: fixed;
}
.app-header {
  position: sticky; top: 0; z-index: 20;
  background: rgba(14,12,10,.92);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
  padding: 12px 14px 10px;
}
.app-header h1 {
  margin: 0 0 4px;
  font-size: 1.15rem; font-weight: 700;
  letter-spacing: .04em; text-transform: uppercase;
  color: var(--accent);
}
.app-header .sub { margin: 0 0 10px; color: var(--muted); font-size: .8rem; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
.filters label {
  display: flex; flex-direction: column; gap: 3px;
  font-size: .7rem; text-transform: uppercase; letter-spacing: .06em;
  color: var(--muted); flex: 1 1 100px;
}
.filters input, .filters select {
  appearance: none;
  background: var(--bg-elev);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 1rem;
  min-height: 42px;
}
.filters input { flex: 2 1 180px; width: 100%; }
.filters input:focus, .filters select:focus {
  outline: 2px solid var(--accent); outline-offset: 1px;
}
.meta-bar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 14px; color: var(--muted); font-size: .8rem;
}
#grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
  gap: 12px;
  padding: 0 14px calc(24px + var(--safe-bottom));
}
@media (min-width: 720px) {
  #grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 16px; }
}
.card-tile {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: transform .12s ease, border-color .12s ease;
  text-align: left;
  padding: 0;
  color: inherit;
  font: inherit;
  display: flex; flex-direction: column;
}
.card-tile:hover, .card-tile:focus-visible {
  transform: translateY(-2px);
  border-color: var(--accent);
  outline: none;
}
.card-tile.set-Colovian { border-top: 3px solid var(--colovian); }
.card-tile.set-Anu { border-top: 3px solid var(--anu); }
.card-tile .art {
  aspect-ratio: 3 / 4;
  background: #111;
  object-fit: cover;
  width: 100%;
  display: block;
}
.card-tile .info { padding: 8px 10px 10px; }
.card-tile .name {
  font-size: .9rem; font-weight: 600; line-height: 1.25;
  margin: 0 0 4px;
}
.card-tile .id {
  font-size: .72rem; color: var(--muted); letter-spacing: .02em;
}
.badge {
  display: inline-block;
  font-size: .65rem; text-transform: uppercase; letter-spacing: .05em;
  padding: 2px 6px; border-radius: 4px;
  background: var(--bg-elev-2); color: var(--muted);
  margin-top: 6px;
}
.badge.Leader { color: var(--leader); }
.badge.Martial { color: #e88; }
.badge.Economic { color: #8d8; }
.badge.Rite { color: #c9a; }

.modal-backdrop {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(0,0,0,.72);
  display: none; align-items: flex-end; justify-content: center;
  padding: 0;
}
.modal-backdrop.open { display: flex; }
@media (min-width: 640px) {
  .modal-backdrop { align-items: center; padding: 24px; }
}
.modal {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 16px 16px 0 0;
  width: 100%; max-width: 560px;
  max-height: min(92vh, 920px);
  overflow: auto;
  box-shadow: var(--shadow);
  padding-bottom: var(--safe-bottom);
}
@media (min-width: 640px) {
  .modal { border-radius: 16px; }
}
.modal-top {
  position: sticky; top: 0; z-index: 2;
  display: flex; justify-content: flex-end;
  background: linear-gradient(var(--bg-elev), transparent);
  padding: 8px 8px 0;
}
.modal-close {
  background: var(--bg-elev-2);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 999px;
  width: 40px; height: 40px;
  font-size: 1.2rem; cursor: pointer;
}
.modal-art {
  width: 100%; max-height: 48vh; object-fit: contain;
  background: #0a0908; display: block;
}
.modal-body { padding: 14px 16px 28px; }
.modal-body h2 { margin: 0 0 4px; font-size: 1.35rem; line-height: 1.2; }
.modal-meta { color: var(--muted); font-size: .85rem; margin-bottom: 12px; }
.stats {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  margin: 12px 0;
}
.stat {
  background: var(--bg-elev-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 8px; text-align: center;
}
.stat .label {
  display: block; font-size: .65rem; text-transform: uppercase;
  letter-spacing: .06em; color: var(--muted); margin-bottom: 4px;
}
.stat .val { font-size: 1.25rem; font-weight: 700; color: var(--accent); }
.keywords { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.kw {
  font-size: .75rem; padding: 4px 8px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: #15120e; color: var(--text);
}
.rules { white-space: pre-wrap; line-height: 1.45; margin: 12px 0; font-size: .95rem; }
.flavor {
  margin: 14px 0 0; font-style: italic;
  color: var(--muted); font-size: .9rem;
  border-left: 3px solid var(--border); padding-left: 10px;
}
.empty {
  grid-column: 1 / -1;
  text-align: center; color: var(--muted);
  padding: 48px 16px;
}
</style>
</head>
<body>
<header class="app-header">
  <h1>RUIN Cards</h1>
  <p class="sub" id="countLabel">Loading…</p>
  <div class="filters">
    <label style="flex:2 1 160px">Search
      <input id="q" type="search" placeholder="Name, id, text…" autocomplete="off" />
    </label>
    <label>Set
      <select id="setFilter">
        <option value="">All</option>
        <option value="Colovian">Colovian</option>
        <option value="Anu">Anu</option>
      </select>
    </label>
    <label>Type
      <select id="typeFilter">
        <option value="">All</option>
        <option value="Leader">Leader</option>
        <option value="Martial">Martial</option>
        <option value="Economic">Economic</option>
        <option value="Rite">Rite</option>
      </select>
    </label>
  </div>
</header>
<div class="meta-bar"><span id="shownLabel"></span></div>
<main id="grid" aria-live="polite"></main>

<div class="modal-backdrop" id="modal" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="modal" id="modalInner">
    <div class="modal-top">
      <button type="button" class="modal-close" id="closeBtn" aria-label="Close">×</button>
    </div>
    <img class="modal-art" id="mArt" alt="" />
    <div class="modal-body">
      <h2 id="mName"></h2>
      <div class="modal-meta" id="mMeta"></div>
      <div class="stats">
        <div class="stat"><span class="label">Deploy</span><span class="val" id="mDeploy">—</span></div>
        <div class="stat"><span class="label">Wage</span><span class="val" id="mWage">—</span></div>
        <div class="stat"><span class="label">Might</span><span class="val" id="mMight">—</span></div>
      </div>
      <div class="keywords" id="mKw"></div>
      <div class="rules" id="mText"></div>
      <div class="flavor" id="mFlavor"></div>
    </div>
  </div>
</div>

<script src="cards.js?v=gabriel-art"></script>
<script>
(function () {
  const grid = document.getElementById('grid');
  const qEl = document.getElementById('q');
  const setEl = document.getElementById('setFilter');
  const typeEl = document.getElementById('typeFilter');
  const countLabel = document.getElementById('countLabel');
  const shownLabel = document.getElementById('shownLabel');
  const modal = document.getElementById('modal');
  const closeBtn = document.getElementById('closeBtn');

  function thumbUrl(id) {
    if (id === 'COL-LED-002') return 'thumbs/r2/COL-LED-002.jpg?v=1';
    if (id === 'COL-LED-005') return 'thumbs/r2/COL-LED-005.jpg?v=1';
    return 'thumbs/' + id + '.jpg?v=kaius-clean-2';
  }

  function dash(v) {
    return (v === null || v === undefined || v === '') ? '—' : String(v);
  }

  const cards = Array.isArray(window.RUIN_CARDS) ? window.RUIN_CARDS : (Array.isArray(window.CARDS) ? window.CARDS : []);
  const byId = new Map(cards.map(c => [c.id, c]));

  function matches(c, q, set, type) {
    if (set && c.set !== set) return false;
    if (type && c.type !== type) return false;
    if (!q) return true;
    const hay = [c.name, c.id, c.text, c.flavor, (c.keywords || []).join(' ')].join(' ').toLowerCase();
    return hay.includes(q);
  }

  function render() {
    const q = (qEl.value || '').trim().toLowerCase();
    const set = setEl.value;
    const type = typeEl.value;
    const list = cards.filter(c => matches(c, q, set, type));
    shownLabel.textContent = list.length === cards.length ? '' : list.length + ' shown';
    if (!list.length) {
      grid.innerHTML = '<p class="empty">No cards match.</p>';
      return;
    }
    const frag = document.createDocumentFragment();
    for (const c of list) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'card-tile set-' + (c.set || '');
      btn.dataset.id = c.id;
      const img = document.createElement('img');
      img.className = 'art';
      img.loading = 'lazy';
      img.alt = c.name || c.id;
      img.src = thumbUrl(c.id);
      const info = document.createElement('div');
      info.className = 'info';
      info.innerHTML = '<p class="name"></p><div class="id"></div><span class="badge"></span>';
      info.querySelector('.name').textContent = c.name || c.id;
      info.querySelector('.id').textContent = c.id;
      const badge = info.querySelector('.badge');
      badge.textContent = c.type || '';
      badge.classList.add(c.type || '');
      btn.appendChild(img);
      btn.appendChild(info);
      frag.appendChild(btn);
    }
    grid.innerHTML = '';
    grid.appendChild(frag);
  }

  function openCard(id) {
    const c = byId.get(id);
    if (!c) return;
    document.getElementById('mArt').src = thumbUrl(c.id);
    document.getElementById('mArt').alt = c.name || c.id;
    document.getElementById('mName').textContent = c.name || c.id;
    document.getElementById('mMeta').textContent =
      [c.id, c.set, c.type, c.rarity].filter(Boolean).join(' · ');
    document.getElementById('mDeploy').textContent = dash(c.deploy);
    document.getElementById('mWage').textContent = dash(c.wage);
    document.getElementById('mMight').textContent = dash(c.might);
    const kw = document.getElementById('mKw');
    kw.innerHTML = '';
    (c.keywords || []).forEach(k => {
      const s = document.createElement('span');
      s.className = 'kw';
      s.textContent = k;
      kw.appendChild(s);
    });
    document.getElementById('mText').textContent = c.text || '';
    const fl = document.getElementById('mFlavor');
    fl.textContent = c.flavor || '';
    fl.style.display = c.flavor ? '' : 'none';
    modal.classList.add('open');
    modal.setAttribute('aria-hidden', 'false');
  }

  function closeModal() {
    modal.classList.remove('open');
    modal.setAttribute('aria-hidden', 'true');
    document.getElementById('mArt').removeAttribute('src');
  }

  grid.addEventListener('click', e => {
    const tile = e.target.closest('.card-tile');
    if (tile) openCard(tile.dataset.id);
  });
  closeBtn.addEventListener('click', closeModal);
  modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && modal.classList.contains('open')) closeModal();
  });
  qEl.addEventListener('input', render);
  setEl.addEventListener('change', render);
  typeEl.addEventListener('change', render);

  if (!cards.length) {
    countLabel.textContent = 'No cards loaded';
    grid.innerHTML = '<p class="empty">cards.js did not load. Keep index.html next to cards.js and thumbs/.</p>';
  } else {
    countLabel.textContent = cards.length + ' cards';
    render();
  }
})();
</script>
</body>
</html>
